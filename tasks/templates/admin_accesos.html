{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <div>
      <h2 class="mb-1">Habilitar procesos</h2>
      <p class="text-muted mb-0">Usuario: <strong>{{ u.username }}</strong></p>
    </div>
    <a class="btn btn-outline-secondary" href="{% url 'admin_usuarios' %}">Volver</a>
  </div>

  <form method="post">
    {% csrf_token %}

    <div class="card shadow-sm">
      <div class="card-body">
        {% if procesos %}
          {% for p in procesos %}
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" name="procesos"
                     value="{{ p.id }}" id="p{{ p.id }}"
                     {% if p.id in habilitados %}checked{% endif %}>
              <label class="form-check-label" for="p{{ p.id }}">
                {{ p.nombre }}
              </label>
            </div>
          {% endfor %}
        {% else %}
          <div class="alert alert-warning mb-0">
            No hay procesos creados. Crea procesos en /admin (Proceso).
          </div>
        {% endif %}
      </div>
    </div>

    <button class="btn btn-institucional mt-3">Guardar</button>
  </form>
</div>
{% endblock %}
